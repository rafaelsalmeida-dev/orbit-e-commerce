server:
  port: 8081

security:
  jwt:
    token:
      issuer: orbit-auth-service
      secret-key: ${JWT_SECRET}
      expire-length: 900000
      refresh-expire-length: 604800000


spring:
  application:
    name: auth-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/auth
    username: docker
    password: admin123
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false